spring:
  application:
    name: sago

  # 보험 절차 안내 문구는 분량이 있어 별도 파일로 분리 (기획이 문구만 고칠 수 있도록)
  config:
    import:
      - classpath:insurance-guide.yml
      # 약관 목록도 기획·법무가 코드 없이 고칠 수 있도록 분리
      - classpath:terms.yml

  # ---- Database (PostgreSQL) ----
  # 값은 .env / 환경변수에서 주입 (없으면 localhost 기본값 사용)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accident_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ---- 스키마 마이그레이션 (Flyway) ----
  # 스키마는 db/migration의 SQL이 만든다. 엔티티를 고치면 반드시 V2__, V3__ 으로 변경 스크립트를 쌓는다.
  #
  # baseline-on-migrate는 일부러 켜지 않는다. 켜면 ddl-auto가 만들어둔 옛 DB를 V1이 적용된
  # 것으로 표시하고 넘어가는데, 그 DB에 V1의 유니크 제약·인덱스가 빠져 있어도 validate는
  # 제약을 보지 않아 그대로 기동한다. 중복 가입 차단·토큰 회전 경합 판정 같은 방어가 조용히
  # 빠진 채로 돈다. 꺼두면 옛 DB에서는 Flyway가 기동을 막으므로, DB를 새로 만들어 V1을
  # 처음부터 적용하게 된다. 운영 DB가 아직 없어서 가능한 선택이다.
  flyway:
    enabled: true

  jpa:
    hibernate:
      # 스키마를 만들지 않고 엔티티와 맞는지만 확인한다.
      # update로 두면 엔티티만 고치고 마이그레이션을 빠뜨려도 로컬에서는 돌아가서,
      # 배포 시점에야 어긋남이 드러난다. validate면 그 자리에서 기동이 실패한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---- 업로드 파일 크기 상한 (종류별 세부 상한은 FileCategory에서 관리) ----
  # max-request-size는 FileCategory의 (최대 용량 x 최대 개수) 중 가장 큰 값을 넘어야 한다.
  # 현재 기준은 사고 사진 10MB x 10장 = 100MB. 이 값이 더 작으면 요청이 애플리케이션에
  # 도달하기 전에 잘려서 FileCategory 검증도, 사용자에게 보낼 안내 메시지도 무의미해진다.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 105MB

server:
  port: ${SERVER_PORT:8080}

# ---- Gemini API (체크리스트·보완 질문·촬영 판단·Vision 태깅/OCR·경위서) ----
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  daily-request-limit: ${GEMINI_DAILY_REQUEST_LIMIT:250}
  rpm-limit: ${GEMINI_RPM_LIMIT:10}

# ---- AWS S3 (음성·사진·문서·프로필 이미지·경위서 PDF 저장) ----
# access-key/secret-key를 비워두면 SDK 기본 자격증명 체인(~/.aws, IAM 역할)을 사용한다
aws:
  s3:
    bucket: ${S3_BUCKET_NAME:}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# ---- Google Cloud STT (음성 진술 텍스트 변환) ----
# 인증은 GOOGLE_APPLICATION_CREDENTIALS 환경변수(서비스 계정 키 경로)로 자동 처리됨
stt:
  language-code: ${STT_LANGUAGE_CODE:ko-KR}

# ---- 사고 ----
accident:
  # 진행 중인 사고를 이어서 쓰는 기간 (#34). 사고를 만든 시각부터 센다.
  # 버튼 연타·재시도·앱 재시작으로 생기는 중복은 대부분 몇 분 안에 일어난다.
  # 이 기간 안에는 새 사고를 만들 수 없으므로, 길게 잡으려면 사고 종료 API 사용을 함께 안내해야 한다.
  resume-window: ${ACCIDENT_RESUME_WINDOW:1h}

# ---- CORS (프론트엔드 오리진 허용) ----
# 프론트가 별도 레포·별도 오리진이라 허용 목록이 필요하다.
# 배포 도메인이 정해지면 CORS_ALLOWED_ORIGINS 환경변수로 덮어쓴다 (쉼표 구분).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- JWT (로그인 토큰 발급/검증) ----
jwt:
  secret: ${JWT_SECRET:}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}      # 1시간 (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일 (ms)
  # 만료된 refresh 토큰 행 정리 주기 (한국 시간 기준, 초 분 시 일 월 요일). "-"면 끈다.
  refresh-cleanup-cron: ${JWT_REFRESH_CLEANUP_CRON:0 0 4 * * *}

# ---- OAuth2 소셜 로그인 (카카오 / 구글) ----
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/social/kakao/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/social/google/callback}

# springdoc(Swagger) 등 나머지 세부 설정은 각 기능 붙일 때 여기 추가하세요.
