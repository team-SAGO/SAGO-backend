# 사고 후 보험 처리 절차 안내 문구.
#
# 코드가 아니라 이 파일에서 문구를 관리한다. 기획·법률 검토로 표현이 바뀔 때
# 코드 수정 없이 고칠 수 있어야 하기 때문이다.
#
# TODO(기획): 아래 문구는 일반적인 자동차보험 절차를 기준으로 작성한 초안입니다.
#             이륜차 특약·서비스 정책에 맞는지 기획에서 확인한 뒤 확정해주세요.
#
# 주의: 보험사 대표번호(사고접수 번호)는 이 파일에 넣지 않았습니다.
#       사고 직후에 거는 번호라 하나라도 틀리면 위험합니다.
#       각 보험사 공식 고지 번호를 확인한 뒤 별도 작업으로 추가해주세요.

insurance:
  guide:
    steps:
      - order: 1
        title: 보험사에 사고 접수
        description: 가입한 보험사에 연락해 사고를 접수합니다. 접수번호는 이후 모든 절차에서 필요하니 꼭 받아 적어두세요.
        tips:
          - 사고 일시와 장소, 상대방 정보를 미리 정리해두면 접수가 빠릅니다.
          - 접수번호는 병원 진료와 수리 접수에 계속 사용됩니다.

      - order: 2
        title: 현장 출동 요청
        description: 부상자가 있거나 차량이 움직일 수 없으면 현장 출동을 요청하세요. 담당자가 도착할 때까지 현장을 그대로 두는 편이 좋습니다.
        tips:
          - 이동이 불가피하면 옮기기 전에 현장 사진을 남겨두세요.

      - order: 3
        title: 경찰 신고 여부 확인
        description: 인명 피해가 있는 사고는 경찰 신고 대상입니다. 신고가 필요한 상황인지 확인하세요.
        tips:
          - 당장 아프지 않아도 시간이 지나 증상이 나타나는 경우가 있습니다.

      - order: 4
        title: 병원 진료 시 접수번호 제출
        description: 자동차보험으로 진료를 받으려면 병원에 보험 접수번호를 알려야 합니다.
        tips:
          - 접수번호 없이 먼저 결제했다면 영수증을 보관해두세요.

      - order: 5
        title: 과실비율 협의
        description: 양측 보험사가 사고 정황을 바탕으로 과실비율을 협의합니다. 결과에 동의하기 어려우면 이의를 제기할 수 있습니다.
        tips:
          - 블랙박스 영상과 현장 사진이 협의의 근거가 됩니다.
          - SAGO에 저장해둔 사진과 경위서를 보험사에 제출할 수 있습니다.

      - order: 6
        title: 보상 처리 및 종결
        description: 치료비와 수리비 지급이 끝나면 사건이 종결됩니다.
        tips:
          - 종결 전에 누락된 치료나 수리 항목이 없는지 확인하세요.
