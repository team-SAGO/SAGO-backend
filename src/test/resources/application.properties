# 테스트 전용 설정 - 인메모리 H2 사용 (로컬 Postgres 불필요)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트는 엔티티에서 스키마를 만든다 (H2). 마이그레이션 SQL은 PostgreSQL 문법이라 여기서 돌리지 않는다.
# 대신 FlywayMigrationTest가 baseline을 실제로 적용해 유효한지 따로 확인한다.
spring.flyway.enabled=false

# JWT - 테스트 전용 더미 시크릿 (HS256 최소 길이 32바이트 충족)
jwt.secret=test-only-secret-key-for-sago-backend-1234567890
jwt.access-expiration=3600000
jwt.refresh-expiration=1209600000

# 만료 토큰 정리 스케줄러는 끈다 (테스트 도중 실행되어 결과가 흔들리지 않도록)
jwt.refresh-cleanup-cron=-
