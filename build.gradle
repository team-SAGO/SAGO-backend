plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sago'
version = '0.0.1-SNAPSHOT'
description = 'SAGO - 이륜차 사고 대응 서비스 백엔드'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ---- Core (Spring Boot 3.5.x) ----
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ---- Lombok ----
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ---- DB Driver ----
	runtimeOnly 'org.postgresql:postgresql'

	// ---- Test ----
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2' // 테스트는 인메모리 H2로 (로컬 Postgres 없이도 build 통과)

	// =====================================================================
	// TODO: 필요할 때 주석 해제해서 사용하세요 (팀 스택 문서 기준 특화 라이브러리)
	// =====================================================================
	// -- JWT (jjwt) : 로그인 토큰 발급/검증
	// implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	// runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
	// runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'
	//
	// -- API 문서 (springdoc / Swagger UI)
	// implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	//
	// -- .env 로드 (spring-dotenv)
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	//
	// -- AWS S3 (음성 원본 / 사진 / 문서 / 프로필 이미지 / 경위서 PDF 저장)
	implementation platform('software.amazon.awssdk:bom:2.31.0')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sts' // DefaultCredentialsProvider의 Web Identity(EKS IRSA) 경로에 필요
	//
	// -- Google Cloud STT (음성 → 텍스트)
	implementation platform('com.google.cloud:libraries-bom:26.50.0')
	implementation 'com.google.cloud:google-cloud-speech'
	//
	// -- PDF 생성 (OpenHTMLtoPDF)
	// implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
}

tasks.named('test') {
	useJUnitPlatform()
}
